<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b9b59">
<title>Pokémon: Pallet &amp; Route 1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17251c;color:#f6f3df}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:radial-gradient(ellipse,#34583c,#17251c)}#shell{width:min(100%,900px);text-align:center}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 auto 8px;max-width:768px}h1{font-size:clamp(18px,4vw,28px);margin:4px;color:#ffe995;text-shadow:2px 2px #542c31}.help{font-size:12px;color:#d5e2cb}#stage{position:relative;width:min(100%,768px);margin:auto;border:6px solid #4b3540;border-radius:8px;background:#182b33;box-shadow:0 12px 35px #0009;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:8px}.badge{align-self:flex-start;background:#182319dc;border:2px solid #e4dfbb;border-radius:5px;padding:5px 9px;text-align:left;font: bold 12px monospace}.dialog{display:none;max-width:100%;min-height:82px;background:#f5f3df;color:#252a2d;border:4px solid #555b61;border-radius:8px;text-align:left;padding:10px;font: bold 14px/1.45 monospace;pointer-events:auto}.dialog.show{display:block}.dialog button{float:right;margin:8px 0 0 10px;padding:8px 14px;border:2px solid #444;border-radius:4px;background:#e2e5ef;color:#18212a;font-weight:bold}.controls{display:flex;align-items:center;justify-content:space-between;max-width:768px;margin:10px auto;gap:12px;touch-action:none}.pad{display:grid;grid-template:repeat(3,48px)/repeat(3,48px);gap:3px}.controls button{border:2px solid #d8d3b3;border-radius:10px;background:#394b55;color:white;font-weight:bold;font-size:18px;box-shadow:0 3px #161e22;touch-action:none}.pad button{width:48px;height:48px}.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .center{grid-area:2/2;background:#26353b}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}.action{display:flex;gap:10px}.action button{width:66px;height:58px;border-radius:50%;background:#b73c47}.action #b{background:#3879a1}.small{font-size:11px;color:#c6d1c1;margin:6px}#overlay{position:fixed;inset:0;display:none;place-items:center;background:#0009;padding:16px}#panel{width:min(520px,100%);background:#f4f1dc;color:#26302d;border:5px solid #60525a;border-radius:8px;padding:16px;text-align:left}#panel h2{margin:0 0 10px}#panel button{padding:9px 12px;margin:4px;background:#dce1e6;border:2px solid #697078;border-radius:4px;color:#222;font-weight:bold}#panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}#panel button:disabled{opacity:.5}#panel progress{width:100%}@media(max-width:520px){body{padding:5px}.controls{margin:8px 6px}.pad{grid-template:repeat(3,42px)/repeat(3,42px)}.pad button{width:42px;height:42px}.action button{width:56px;height:52px}}
</style></head><body><main id="shell"><header><h1>Pokémon: Pallet &amp; Route 1</h1><span class="help">Move: arrows / WASD · A / Space: interact · B / Esc: back · Enter: confirm</span></header><div id="stage"><canvas id="game" width="768" height="512" aria-label="Pokémon top-down adventure game"></canvas><div id="hud"><div class="badge" id="status">PALLET TOWN<br>Starter: none</div><div class="dialog" id="dialog" role="status"></div></div></div><nav class="controls" aria-label="Touch controls"><div class="pad"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="center" aria-label="Movement pad">●</button><button class="right" data-key="ArrowRight">▶</button><button class="down" data-key="ArrowDown">▼</button></div><div class="action"><button id="b" aria-label="B button">B</button><button id="a" aria-label="A button">A</button></div></nav><p class="small">Explore, talk to neighbors, and search tall grass. Progress saves automatically on this device.</p></main><div id="overlay"><section id="panel"></section></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d'),dialog=document.querySelector('#dialog'),status=document.querySelector('#status'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');ctx.imageSmoothingEnabled=false;
const T=32,W=40,H=28,tiles=Array.from({length:H},()=>Array(W).fill('grass'));
// Hand-authored Pallet Town and Route 1 tile map. 0 grass, path, water, tree, tall grass, fence.
const set=(x,y,t)=>{if(tiles[y]&&tiles[y][x]!==undefined)tiles[y][x]=t};
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x<2||x>37||y<2||y>25)set(x,y,'tree');
for(let y=2;y<26;y++)for(let x=2;x<38;x++){if((x>3&&x<12&&y>4&&y<13)||(x>27&&y<15))set(x,y,'tall')}
for(let y=2;y<26;y++)set(19,y,'path');for(let x=2;x<38;x++)set(x,14,'path');
for(let y=5;y<10;y++)for(let x=6;x<12;x++)set(x,y,'house');for(let y=5;y<10;y++)for(let x=26;x<32;x++)set(x,y,'house');
for(let x=5;x<13;x++)set(x,10,'fence');for(let x=25;x<33;x++)set(x,10,'fence');
for(let y=17;y<21;y++)for(let x=30;x<35;x++)set(x,y,'water');for(let x=29;x<36;x++)set(x,16,'tree');
for(let y=20;y<25;y++)for(let x=4;x<9;x++)set(x,y,'tall');
const imgCache=new Map();function sprite(url){if(!imgCache.has(url)){const im=new Image();im.crossOrigin='anonymous';im.src=url;imgCache.set(url,im)}return imgCache.get(url)}
const monUrl=(id,back=false)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${back?'back/':''}${id}.png`;
const species=[{id:16,name:'Pidgey',type:'normal',moves:['Tackle','Gust','Quick Attack','Sand Attack']},{id:19,name:'Rattata',type:'normal',moves:['Tackle','Quick Attack','Bite','Tail Whip']},{id:10,name:'Caterpie',type:'bug',moves:['Tackle','String Shot','Bug Bite','Headbutt']},{id:25,name:'Pikachu',type:'electric',moves:['Thunder Shock','Quick Attack','Tail Whip','Thunder Wave']},{id:1,name:'Bulbasaur',type:'grass',moves:['Tackle','Vine Whip','Razor Leaf','Growl']},{id:4,name:'Charmander',type:'fire',moves:['Scratch','Ember','Quick Attack','Growl']},{id:7,name:'Squirtle',type:'water',moves:['Tackle','Water Gun','Bubble','Tail Whip']},{id:13,name:'Weedle',type:'bug',moves:['Poison Sting','String Shot','Bug Bite','Tackle']}];
const fresh=()=>({px:19,py:13,face:'down',steps:0,starter:null,party:[],balls:5,seen:[],wins:0});let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem('pallet-save')||'{}'))}catch{state=fresh()};function save(){localStorage.setItem('pallet-save',JSON.stringify(state));updateStatus()}function updateStatus(){const lead=state.party[0];status.innerHTML=`${state.py>17?'ROUTE 1':'PALLET TOWN'}<br>${lead?`${lead.name} Lv.${lead.lv} · HP ${lead.hp}/${lead.max}`:'Choose a starter · A to begin'} · Balls ${state.balls}`}
let npc=[{x:16,y:12,name:'Mara',line:'Welcome to Pallet Town! Tall grass is full of wild Pokémon. Be ready for a battle.'},{x:22,y:14,name:'Professor Oak',line:'A Pokémon grows stronger through friendship and experience. Press A to talk or use a menu.'},{x:20,y:5,name:'Route Guide',line:'On Route 1, wild Pokémon hide in the grass. Catch them with a Poké Ball!'}];let mode='world',battle=null,keys=new Set(),last=0,moveTimer=0;
function tile(x,y){return tiles[y]?.[x]||'tree'}function blocked(x,y){return ['tree','water','house','fence'].includes(tile(x,y))||npc.some(n=>n.x===x&&n.y===y)}
function tileDraw(t,x,y){let px=x*T,py=y*T;const r=(a,b,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(px+a,py+b,w,h)};if(t==='grass'){r(0,0,T,T,'#75b858');r(4,5,2,3,'#66a94e');r(22,19,2,4,'#85c367')}else if(t==='path'){r(0,0,T,T,'#d5bc79');r(5,8,3,2,'#c5a96a');r(23,24,2,2,'#e3ce91')}else if(t==='tall'){r(0,0,T,T,'#5d9c48');for(let i=0;i<5;i++){r(3+i*6,13+(i%2)*3,3,12,'#297846');r(5+i*6,10+(i%3),3,14,'#3a8a47')}}else if(t==='tree'){r(0,0,T,T,'#678f4b');r(3,7,26,24,'#296344');r(7,2,18,21,'#34774a');r(12,0,9,16,'#458551');r(0,27,T,5,'#755238')}else if(t==='water'){r(0,0,T,T,'#4d9fc2');r(4,6,12,2,'#a4dcec');r(20,19,8,2,'#a4dcec')}else if(t==='house'){r(0,0,T,T,'#d1a06b');r(0,0,T,10,'#8e5149');r(4,12,9,11,'#5c93ac');r(20,12,9,11,'#5c93ac');r(13,18,7,14,'#654638');r(15,23,2,2,'#f0d47b')}else if(t==='fence'){r(0,0,T,T,'#75b858');r(1,9,30,5,'#ddc78d');r(1,20,30,5,'#c6ab70');for(let i=2;i<30;i+=9)r(i,6,4,22,'#b58a5b')}}
function drawPerson(x,y,color='#dc554b',frame=0){const px=x*T,py=y*T;r(px+9,py+3,14,10,'#f2c89b');r(px+7,py,18,6,color);r(px+8,py+13,16,11,color);r(px+5,py+14,4,10,'#f2c89b');r(px+23,py+14,4,10,'#f2c89b');r(px+8,py+24+(frame?2:0),6,7,'#304767');r(px+19,py+24+(frame?0:2),6,7,'#304767');function r(a,b,w,h,col){ctx.fillStyle=col;ctx.fillRect(a,b,w,h)}}
function drawWorld(){ctx.clearRect(0,0,c.width,c.height);const ox=Math.max(0,Math.min(W* T-c.width,state.px*T-c.width/2)),oy=Math.max(0,Math.min(H*T-c.height,state.py*T-c.height/2));ctx.save();ctx.translate(-ox,-oy);for(let y=0;y<H;y++)for(let x=0;x<W;x++)tileDraw(tile(x,y),x,y);drawPerson(16,12,'#e1a43c',0);drawPerson(22,14,'#f2f1ed',1);drawPerson(20,5,'#3b82b7',0);drawPerson(state.px,state.py,'#d94f4c',Math.floor(Date.now()/180)%2);ctx.restore()}
function text(msg,cb){dialog.innerHTML=`<span>${msg}</span>${cb?'<button id="next">OK ▸</button>':''}`;dialog.classList.add('show');if(cb)document.querySelector('#next').onclick=()=>{dialog.classList.remove('show');cb()}}
function starterMenu(){modal('Choose your first partner',`<div class="grid">${[species[4],species[5],species[6]].map(p=>`<button data-starter="${p.id}"><img width="52" height="52" src="${monUrl(p.id)}"><br>${p.name}</button>`).join('')}</div><p>Use arrow keys or tap a Pokémon to begin.</p>`);panel.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>{const p=species.find(s=>s.id==b.dataset.starter);state.starter=p.name;state.party=[makeMon(p,5)];save();closeModal();text(`${p.name} joins your team! Explore Route 1 and walk through tall grass to meet wild Pokémon.`)})}
function modal(title,body){panel.innerHTML=`<h2>${title}</h2>${body}`;overlay.style.display='grid'}function closeModal(){overlay.style.display='none'}function makeMon(s,lv){let max=18+lv*4;return{id:s.id,name:s.name,type:s.type,moves:s.moves.map((n,i)=>({name:n,pp:[35,25,20,15][i],max:[35,25,20,15][i]})),lv,max,hp:max,xp:0}}
function interact(){if(dialog.classList.contains('show')){dialog.classList.remove('show');return}if(!state.starter){starterMenu();return}let tx=state.px+(state.face==='right'?1:state.face==='left'?-1:0),ty=state.py+(state.face==='down'?1:state.face==='up'?-1:0),n=npc.find(v=>Math.abs(v.x-tx)+Math.abs(v.y-ty)<=1);if(n){text(`${n.name}: “${n.line}”`);return}if(tile(tx,ty)==='house'){text('The door is shut.');return}openParty()}
function openParty(){modal('Your Pokémon',state.party.length?state.party.map((p,i)=>`<p><img src="${monUrl(p.id)}" width="36" style="vertical-align:middle"> <b>${p.name}</b> Lv.${p.lv} · HP ${p.hp}/${p.max} <button data-lead="${i}">Lead</button></p>`).join(''):'Your team is empty. Choose a starter with A.');panel.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{let i=+b.dataset.lead;state.party.unshift(state.party.splice(i,1)[0]);save();closeModal()})}
function walk(dx,dy){if(mode!=='world'||dialog.classList.contains('show')||overlay.style.display==='grid')return;state.face=dx?'':state.face;state.face=dx<0?'left':dx>0?'right':dy<0?'up':'down';let nx=state.px+dx,ny=state.py+dy;if(!blocked(nx,ny)){state.px=nx;state.py=ny;state.steps++;if(tile(nx,ny)==='tall'&&state.party.length&&Math.random()<.18)startBattle()}save()}
function startBattle(){if(mode!=='world'||!state.party.length)return;let pool=state.py>18?[species[0],species[1],species[2],species[7]]:[species[0],species[1],species[2],species[7]];const s=pool[Math.floor(Math.random()*pool.length)],wild=makeMon(s,2+Math.floor(Math.random()*3));battle={wild,player:state.party.find(p=>p.hp>0)||state.party[0],turn:'menu'};mode='battle';const bg=ctx.createLinearGradient(0,0,0,512);bg.addColorStop(0,'#d9f0e8');bg.addColorStop(.5,'#f8f3df');bg.addColorStop(.51,'#91bf78');bg.addColorStop(1,'#d8dfaa');ctx.fillStyle=bg;ctx.fillRect(0,0,768,512);ctx.fillStyle='#77ae69';ctx.beginPath();ctx.ellipse(560,190,132,35,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(198,355,150,42,0,0,7);ctx.fill();ctx.drawImage(sprite(monUrl(wild.id)),490,105,120,120);ctx.drawImage(sprite(monUrl(battle.player.id,true)),115,260,145,145);text(`A wild ${wild.name} appeared!`);renderBattle()}
function renderBattle(){if(mode!=='battle')return;const p=battle.player,w=battle.wild;modal('Wild Pokémon battle',`<div style="display:flex;justify-content:space-between;align-items:center"><div><b>${w.name} Lv.${w.lv}</b><br><progress max="${w.max}" value="${w.hp}"></progress><br>${w.hp}/${w.max} HP</div><img src="${monUrl(w.id)}" width="100"></div><hr><div style="display:flex;justify-content:space-between;align-items:center"><img src="${monUrl(p.id,true)}" width="100"><div><b>${p.name} Lv.${p.lv}</b><br><progress max="${p.max}" value="${p.hp}"></progress><br>${p.hp}/${p.max} HP</div></div><div id="battleMsg">Choose a move or action.</div><div class="grid">${p.moves.map((m,i)=>`<button data-move="${i}" ${m.pp<=0?'disabled':''}>${m.name}<br>PP ${m.pp}/${m.max}</button>`).join('')}<button id="catch" ${state.balls<1?'disabled':''}>Throw Poké Ball (${state.balls})</button><button id="party">Pokémon</button><button id="run">Run</button><button id="battleClose">Close</button></div>`);panel.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>attack(+b.dataset.move));panel.querySelector('#catch').onclick=catchMon;panel.querySelector('#run').onclick=()=>{closeModal();endBattle('You got away safely.')};panel.querySelector('#party').onclick=()=>{const living=state.party.filter(x=>x.hp>0);modal('Switch Pokémon',living.map(x=>`<button data-switch="${state.party.indexOf(x)}">${x.name} · ${x.hp}/${x.max} HP</button>`).join('')+`<button id="back">Back</button>`);panel.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{let p=state.party[+b.dataset.switch];if(p!==battle.player){battle.player=p;enemyTurn(`${p.name}, go!`)}else renderBattle()});panel.querySelector('#back').onclick=renderBattle};panel.querySelector('#battleClose').onclick=renderBattle}
function damage(att,def,m){let power=/Vine|Ember|Water|Thunder|Gust|Razor|Bubble|Bite|Scratch|Poison|Bug/.test(m.name)?18:12;let eff=1;if((att.type==='fire'&&def.type==='grass')||(att.type==='water'&&att.type!=='water'&&def.type==='fire')||(att.type==='grass'&&def.type==='water')||(att.type==='electric'&&def.type==='water'))eff=2;if((att.type==='fire'&&def.type==='water')||(att.type==='water'&&def.type==='grass')||(att.type==='grass'&&def.type==='fire'))eff=.5;return Math.max(1,Math.floor(((2*att.lv/5+2)*power/18+2)*(Math.random()*.25+.85)*eff))}
function attack(i){let p=battle.player,w=battle.wild,m=p.moves[i];if(!m||m.pp<=0)return;m.pp--;w.hp=Math.max(0,w.hp-damage(p,w,m));let msg=`${p.name} used ${m.name}!`;if(!w.hp){state.wins++;gainXp(p,12+w.lv*4);save();renderBattle();setTimeout(()=>endBattle(`${w.name} fainted! ${p.name} gained experience.`),700);return}enemyTurn(msg)}function enemyTurn(msg){let w=battle.wild,p=battle.player,m=w.moves[Math.floor(Math.random()*w.moves.length)],hurt=damage(w,p,m);p.hp=Math.max(0,p.hp-hurt);save();renderBattle();let box=document.querySelector('#battleMsg');if(box)box.textContent=`${msg} ${w.name} used ${m.name}; ${p.name} lost ${hurt} HP.`;if(!p.hp)setTimeout(()=>{let next=state.party.find(x=>x.hp>0);if(next){battle.player=next;renderBattle()}else{state.party.forEach(x=>x.hp=x.max);save();endBattle('Your Pokémon were tired. They rested and recovered at home.')}},700)}
function gainXp(p,n){p.xp+=n;if(p.xp>=p.lv*10){p.xp-=p.lv*10;p.lv++;p.max+=4;p.hp=Math.min(p.max,p.hp+4);setTimeout(()=>text(`${p.name} grew to level ${p.lv}!`),300)}}function catchMon(){if(state.balls<1)return;state.balls--;let chance=.34+(1-battle.wild.hp/battle.wild.max)*.55;if(Math.random()<chance){const caught=battle.wild;if(state.party.length<6){caught.hp=Math.max(1,caught.hp);state.party.push(caught);text(`Gotcha! ${caught.name} was caught and joined your team!`)}else{text(`Gotcha! ${caught.name} was caught, but your party is full.`)}if(!state.seen.includes(caught.id))state.seen.push(caught.id);save();closeModal();endBattle('The Pokémon was caught!')}else{renderBattle();let box=document.querySelector('#battleMsg');if(box)box.textContent=`Oh no! ${battle.wild.name} broke free!`;setTimeout(()=>{if(mode==='battle')enemyTurn('')},650)}}function endBattle(msg){mode='world';battle=null;closeModal();drawWorld();updateStatus();text(msg)}
function action(){if(mode==='battle'){if(dialog.classList.contains('show'))dialog.classList.remove('show');renderBattle()}else interact()}
function press(k){if(k==='a'||k===' '||k==='Enter'){action();return}if(k==='b'||k==='Escape'){if(overlay.style.display==='grid')closeModal();else if(dialog.classList.contains('show'))dialog.classList.remove('show');else if(mode==='battle')renderBattle();else openParty();return}let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(d[k])walk(...d[k])}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!keys.has(e.key)){keys.add(e.key);press(e.key)}});window.addEventListener('keyup',e=>keys.delete(e.key));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;let timer;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k);timer=setInterval(()=>press(k),170)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});document.querySelector('#a').addEventListener('pointerdown',e=>{e.preventDefault();action()});document.querySelector('#b').addEventListener('pointerdown',e=>{e.preventDefault();press('b')});overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function frame(t){if(mode==='world')drawWorld();requestAnimationFrame(frame)}
updateStatus();drawWorld();if(!state.starter)setTimeout(starterMenu,350);requestAnimationFrame(frame);
})();
</script></body></html>
