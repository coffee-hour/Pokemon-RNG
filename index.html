<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b956d"><title>Pokémon: Pallet & Route 1</title>
<style>
:root{--p0:#8b956d;--p1:#6b7353;--p2:#434833;--p3:#1f240a;--paper:#e4e5c9;--ink:#202416;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--p3);color:var(--paper);font:12px 'Courier New',monospace;display:grid;place-items:center;padding:12px}#shell{width:min(100%,820px);text-align:center}h1{font:bold 16px 'Courier New',monospace;letter-spacing:2px;margin:4px}.help,.small{font-size:11px;line-height:1.6}#stage{position:relative;width:min(100%,768px);margin:12px auto 0;border:8px solid var(--p2);background:var(--p0);box-shadow:0 0 0 3px var(--p1),0 12px 40px #0008;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;flex-direction:column;justify-content:space-between}.badge{align-self:flex-start;background:var(--paper);color:var(--ink);border:3px double var(--ink);padding:5px 8px;text-align:left;font-weight:bold;line-height:1.5}.dialog{display:none;background:var(--paper);color:var(--ink);border:5px double var(--ink);padding:12px;text-align:left;font:bold 14px/1.55 'Courier New',monospace;min-height:78px;pointer-events:auto}.dialog.show{display:block}.dialog button{float:right;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 12px;font:inherit}.controls{display:flex;justify-content:space-between;align-items:center;max-width:768px;margin:12px auto;touch-action:none}.pad{display:grid;grid-template:repeat(3,44px)/repeat(3,44px);gap:3px}.controls button{border:3px solid var(--p0);background:var(--p2);color:var(--paper);font:bold 17px monospace;touch-action:none}.pad button{width:44px;height:44px}.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .center{grid-area:2/2}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}.action{display:flex;gap:10px}.action button{width:58px;height:58px;border-radius:50%}#overlay{position:fixed;inset:0;display:none;place-items:center;background:#000b;padding:14px;z-index:3}#panel{width:min(550px,100%);background:var(--paper);color:var(--ink);border:6px double var(--ink);padding:16px;text-align:left;box-shadow:0 0 0 4px var(--p1)}#panel h2{margin:0 0 12px;font-size:15px}#panel button{padding:9px 10px;margin:4px;background:var(--paper);border:3px double var(--ink);color:var(--ink);font:bold 12px monospace;cursor:pointer}#panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}#panel button:disabled{opacity:.45}#panel progress{accent-color:var(--p2);height:10px;width:125px;vertical-align:middle}.monrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.monrow img{image-rendering:pixelated;object-fit:contain;width:112px;height:112px}.infobox{background:var(--paper);border:4px double var(--ink);padding:7px 10px;min-width:190px;font-weight:bold;line-height:1.7}.infobox small{font-weight:normal}#battleMsg{min-height:38px;border:4px double var(--ink);padding:8px;margin:8px 0}.pixel{image-rendering:pixelated}@media(max-width:520px){body{padding:5px}h1{font-size:13px}.controls{margin:8px 5px}.pad{grid-template:repeat(3,38px)/repeat(3,38px)}.pad button{width:38px;height:38px}.action button{width:52px;height:52px}.infobox{min-width:140px}.monrow img{width:82px;height:82px}}
</style></head><body><main id="shell"><h1>POKÉMON: PALLET & ROUTE 1</h1><div class="help">Move: arrows / WASD · A / Space: interact · B / Esc: back</div><div id="stage"><canvas id="game" width="768" height="512" aria-label="Gen 1 style Pokémon adventure"></canvas><div id="hud"><div class="badge" id="status">PALLET TOWN</div><div class="dialog" id="dialog" role="status"></div></div></div><nav class="controls" aria-label="Touch controls"><div class="pad"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="center" aria-label="Movement pad">·</button><button class="right" data-key="ArrowRight">▶</button><button class="down" data-key="ArrowDown">▼</button></div><div class="action"><button id="b" aria-label="B button">B</button><button id="a" aria-label="A button">A</button></div></nav><p class="small">Local progress saves on this device. Gen 1-inspired fan project; not an official Pokémon game.</p></main><div id="overlay"><section id="panel"></section></div>
<script>(()=>{'use strict';
const C=['#8b956d','#6b7353','#434833','#1f240a'],c=document.querySelector('#game'),ctx=c.getContext('2d'),dialog=document.querySelector('#dialog'),status=document.querySelector('#status'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');ctx.imageSmoothingEnabled=false;
const T=32,W=40,H=28,tiles=Array.from({length:H},()=>Array(W).fill('grass')),set=(x,y,t)=>{if(tiles[y]&&tiles[y][x]!==undefined)tiles[y][x]=t};
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x<2||x>37||y<2||y>25)set(x,y,'tree');for(let y=2;y<26;y++)for(let x=2;x<38;x++)if((x>3&&x<12&&y>4&&y<13)||(x>27&&y>14))set(x,y,'tall');for(let y=2;y<26;y++)set(19,y,'path');for(let x=2;x<38;x++)set(x,14,'path');for(let y=5;y<10;y++)for(let x=6;x<12;x++)set(x,y,'house');for(let y=5;y<10;y++)for(let x=26;x<32;x++)set(x,y,'house');for(let x=5;x<13;x++)set(x,10,'fence');for(let x=25;x<33;x++)set(x,10,'fence');for(let y=18;y<22;y++)for(let x=30;x<35;x++)set(x,y,'water');for(let x=29;x<36;x++)set(x,17,'tree');
const gen='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-i/red-blue/',species=[{id:16,name:'Pidgey',type:'normal',moves:['Gust','Sand Attack','Quick Attack','Tackle']},{id:19,name:'Rattata',type:'normal',moves:['Tackle','Tail Whip','Quick Attack','Bite']},{id:10,name:'Caterpie',type:'bug',moves:['Tackle','String Shot']},{id:13,name:'Weedle',type:'bug',moves:['Poison Sting','String Shot']},{id:1,name:'Bulbasaur',type:'grass',moves:['Tackle','Growl','Leech Seed','Vine Whip']},{id:4,name:'Charmander',type:'fire',moves:['Scratch','Growl','Ember','Leer']},{id:7,name:'Squirtle',type:'water',moves:['Tackle','Tail Whip','Bubble','Water Gun']}];
const urls={front:id=>gen+id+'.png',back:id=>gen+'back/'+id+'.png',transparent:id=>gen+'transparent/'+id+'.png'};const cache=new Map();function img(url){if(!cache.has(url)){let i=new Image();i.crossOrigin='anonymous';i.src=url;cache.set(url,i)}return cache.get(url)}
const fresh=()=>({px:19,py:13,face:'down',starter:null,party:[],balls:5,wins:0});let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem('pallet-save')||'{}'))}catch{state=fresh()}function save(){localStorage.setItem('pallet-save',JSON.stringify(state));updateStatus()}function updateStatus(){let p=state.party[0];status.innerHTML=`${state.py>17?'ROUTE 1':'PALLET TOWN'}<br>${p?`${p.name} Lv.${p.lv} · HP ${p.hp}/${p.max}`:'A: choose a starter'} · BALLS ${state.balls}`}
const npc=[{x:16,y:12,name:'MARA',line:'Route 1 is north of here. Watch for wild Pokémon in the tall grass!'},{x:22,y:14,name:'PROF. OAK',line:'A Pokémon grows stronger through friendship and experience.'},{x:20,y:5,name:'GUIDE',line:'Pidgey and Rattata roam Route 1. Take care in the grass!'}];function tile(x,y){return tiles[y]?.[x]||'tree'}function blocked(x,y){return['tree','water','house','fence'].includes(tile(x,y))||npc.some(n=>n.x===x&&n.y===y)}
function rect(x,y,w,h,k){ctx.fillStyle=C[k];ctx.fillRect(x,y,w,h)}function tileDraw(t,x,y){let a=x*T,b=y*T,r=(dx,dy,w,h,k)=>rect(a+dx,b+dy,w,h,k);if(t==='grass'){r(0,0,32,32,0);r(5,7,2,4,1);r(22,21,2,3,1)}else if(t==='path'){r(0,0,32,32,1);r(5,8,3,2,0);r(23,23,2,2,0)}else if(t==='tall'){r(0,0,32,32,1);for(let i=0;i<5;i++){r(3+i*6,14+i%2*3,3,12,3);r(5+i*6,10+i%3,3,14,2)}}else if(t==='tree'){r(0,0,32,32,1);r(3,8,26,23,3);r(7,3,18,21,2);r(12,0,9,16,1)}else if(t==='water'){r(0,0,32,32,2);r(4,6,12,2,0);r(20,20,8,2,0)}else if(t==='house'){r(0,0,32,32,0);r(0,0,32,10,3);r(4,12,9,11,2);r(20,12,9,11,2);r(13,18,7,14,3)}else if(t==='fence'){r(0,0,32,32,0);r(1,9,30,5,2);r(1,20,30,5,1);for(let i=2;i<30;i+=9)r(i,6,4,22,2)}}
function person(x,y,k=3,frame=0){let a=x*T,b=y*T;rect(a+9,b+3,14,10,0);rect(a+7,b,18,6,k);rect(a+8,b+13,16,11,k);rect(a+5,b+14,4,10,0);rect(a+23,b+14,4,10,0);rect(a+8,b+24+(frame?2:0),6,7,3);rect(a+19,b+24+(frame?0:2),6,7,3)}function drawWorld(){ctx.clearRect(0,0,c.width,c.height);let ox=Math.max(0,Math.min(W*T-c.width,state.px*T-c.width/2)),oy=Math.max(0,Math.min(H*T-c.height,state.py*T-c.height/2));ctx.save();ctx.translate(-ox,-oy);for(let y=0;y<H;y++)for(let x=0;x<W;x++)tileDraw(tile(x,y),x,y);person(16,12,2);person(22,14,0);person(20,5,1);person(state.px,state.py,3,Math.floor(Date.now()/180)%2);ctx.restore()}
function say(s){dialog.innerHTML=`<span>${s} ▼</span>`;dialog.classList.add('show')}function modal(title,body){panel.innerHTML=`<h2>${title}</h2>${body}`;overlay.style.display='grid'}function closeModal(){overlay.style.display='none'}function makeMon(s,lv){let max=10+lv*3;return{id:s.id,name:s.name,type:s.type,moves:s.moves.slice(0,4).map((name,i)=>({name,pp:[35,40,15,25][i]||20,max:[35,40,15,25][i]||20,power:/Ember|Water Gun|Vine Whip|Bubble|Bite|Scratch|Gust|Poison/.test(name)?40:0})),lv,max,hp:max,xp:0}}function starters(){modal('CHOOSE YOUR POKÉMON',`<div class="grid">${species.slice(4).map(p=>`<button data-starter="${p.id}">${p.name}</button>`).join('')}</div>`);panel.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>{let p=species.find(x=>x.id==b.dataset.starter);state.starter=p.name;state.party=[makeMon(p,5)];save();closeModal();say(`${p.name} joined your party! Head north to Route 1.`)})}
function party(){modal('POKÉMON',state.party.map((p,i)=>`<p>${p.name} Lv.${p.lv} &nbsp; HP ${p.hp}/${p.max} <button data-lead="${i}">SET FIRST</button></p>`).join('')||'No Pokémon yet.');panel.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{let i=+b.dataset.lead;state.party.unshift(state.party.splice(i,1)[0]);save();closeModal()})}function interact(){if(dialog.classList.contains('show')){dialog.classList.remove('show');return}if(!state.starter){starters();return}let dx=state.face==='right'?1:state.face==='left'?-1:0,dy=state.face==='down'?1:state.face==='up'?-1:0,tx=state.px+dx,ty=state.py+dy,n=npc.find(v=>Math.abs(v.x-tx)+Math.abs(v.y-ty)<=1);if(n){say(`${n.name}: ${n.line}`);return}if(tile(tx,ty)==='house')say('The door is shut.');else party()}
function walk(dx,dy){if(mode!=='world'||dialog.classList.contains('show')||overlay.style.display==='grid')return;state.face=dx<0?'left':dx>0?'right':dy<0?'up':'down';let x=state.px+dx,y=state.py+dy;if(!blocked(x,y)){state.px=x;state.py=y;if(tile(x,y)==='tall'&&state.party.length&&Math.random()<.16)startBattle()}save()}
let mode='world',battle=null;function startBattle(){if(mode!=='world')return;let pool=state.py>17?[species[0],species[1]]:[species[0],species[1],species[2],species[3]],s=pool[Math.random()*pool.length|0],wild=makeMon(s,2+(Math.random()*3|0));battle={wild,player:state.party.find(p=>p.hp>0)||state.party[0]};mode='battle';renderBattle(`A wild ${wild.name} appeared!`)}function renderBattle(msg='Choose an action.'){if(!battle)return;let p=battle.player,w=battle.wild;modal('POKÉMON BATTLE',`<div class="monrow"><div class="infobox">${w.name} <small>Lv${w.lv}</small><br>HP <progress max="${w.max}" value="${w.hp}"></progress></div><img class="pixel" src="${urls.front(w.id)}" alt="${w.name}"></div><div class="monrow"><img class="pixel" src="${urls.back(p.id)}" alt="${p.name}"><div class="infobox">${p.name} <small>Lv${p.lv}</small><br>HP <progress max="${p.max}" value="${p.hp}"></progress><br><small>${p.hp} / ${p.max}</small></div></div><div id="battleMsg">${msg} ▼</div><div class="grid">${p.moves.map((m,i)=>`<button data-move="${i}" ${m.pp<=0?'disabled':''}>${m.name}<br>PP ${m.pp}</button>`).join('')}<button id="catch" ${state.balls<1?'disabled':''}>POKÉ BALL · ${state.balls}</button><button id="partyBtn">PKMN</button><button id="run">RUN</button></div>`);panel.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>attack(+b.dataset.move));panel.querySelector('#catch').onclick=catchMon;panel.querySelector('#run').onclick=()=>endBattle('Got away safely!');panel.querySelector('#partyBtn').onclick=party}
function hit(att,def,m){let pow=m.power||20,eff=((att.type==='fire'&&def.type==='grass')||(att.type==='water'&&def.type==='fire')||(att.type==='grass'&&def.type==='water'))?2:1;return Math.max(1,Math.floor((2*att.lv/5+2)*pow/50*eff*(.85+Math.random()*.15)))}function attack(i){let p=battle.player,w=battle.wild,m=p.moves[i];if(!m||!m.pp)return;m.pp--;w.hp=Math.max(0,w.hp-hit(p,w,m));if(!w.hp){state.wins++;save();renderBattle(`${w.name} fainted!`);setTimeout(()=>endBattle(`${w.name} fainted!`),700);return}let em=w.moves[Math.random()*w.moves.length|0];p.hp=Math.max(0,p.hp-hit(w,p,em));save();renderBattle(`${p.name} used ${m.name}! ${w.name} used ${em.name}!`);if(!p.hp)setTimeout(()=>endBattle(`${p.name} needs to rest.`),700)}function catchMon(){if(!state.balls)return;state.balls--;if(Math.random()<.38+(1-battle.wild.hp/battle.wild.max)*.5){let p=battle.wild;if(state.party.length<6)state.party.push(p);save();endBattle(`Gotcha! ${p.name} was caught!`)}else renderBattle(`${battle.wild.name} broke free!`)}function endBattle(msg){mode='world';battle=null;closeModal();drawWorld();updateStatus();say(msg)}
function action(){if(mode==='battle')renderBattle();else interact()}function press(k){if(k==='a'||k===' '||k==='Enter'){action();return}if(k==='b'||k==='Escape'){if(overlay.style.display==='grid')closeModal();else if(dialog.classList.contains('show'))dialog.classList.remove('show');else if(mode==='world')party();return}let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(d[k])walk(...d[k])}let keys=new Set();window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!keys.has(e.key)){keys.add(e.key);press(e.key)}});window.addEventListener('keyup',e=>keys.delete(e.key));document.querySelectorAll('[data-key]').forEach(b=>{let tm;b.addEventListener('pointerdown',e=>{e.preventDefault();press(b.dataset.key);tm=setInterval(()=>press(b.dataset.key),180)});['pointerup','pointerleave','pointercancel'].forEach(x=>b.addEventListener(x,()=>clearInterval(tm)))});document.querySelector('#a').addEventListener('pointerdown',e=>{e.preventDefault();action()});document.querySelector('#b').addEventListener('pointerdown',e=>{e.preventDefault();press('b')});overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});function frame(){if(mode==='world')drawWorld();requestAnimationFrame(frame)}updateStatus();drawWorld();if(!state.starter)setTimeout(starters,350);requestAnimationFrame(frame);
})();</script></body></html>
