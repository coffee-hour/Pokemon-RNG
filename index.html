<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#8bac0f"><title>Pokémon Red — Modular Adventure</title><link rel="stylesheet" href="style.css"></head><body><main class="console"><header><h1>POKÉMON RED: PALLET &amp; ROUTE 1</h1><p>Move: arrows / WASD · A: Z / Enter / Space · B: X / Shift</p></header><div class="screen"><canvas id="game" width="256" height="240" aria-label="Pokémon adventure game"></canvas><div id="status" class="status">PALLET TOWN</div><div id="dialog" class="dialog" role="status" aria-live="polite"></div></div><nav class="controls" aria-label="Virtual game controls"><div class="dpad"><button data-key="ArrowUp" class="up" aria-label="Up">▲</button><button data-key="ArrowLeft" class="left" aria-label="Left">◀</button><span class="hub"></span><button data-key="ArrowRight" class="right" aria-label="Right">▶</button><button data-key="ArrowDown" class="down" aria-label="Down">▼</button></div><div class="actions"><button data-key="x" class="b-button" aria-label="B button">B</button><button data-key="z" class="a-button" aria-label="A button">A</button></div></nav><footer>Fan-made, original implementation. Progress is saved locally.</footer></main><script type="module" src="js/main.js"></script></body></html>
