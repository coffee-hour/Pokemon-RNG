<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d6d9df"><title>Pokémon Red — Game Boy Player</title><link rel="stylesheet" href="style.css"></head>
<body><main class="console" id="dropzone"><header><div class="power"><i></i> POWER</div><p class="brand">Nintendo <b>GAME BOY</b><small>™</small></p><span class="model">DOT MATRIX WITH STEREO SOUND</span></header>
<section class="bezel" aria-label="Game Boy display"><div class="lcd"><div id="game" aria-label="Emulator screen"></div><div id="placeholder"><strong>INSERT CARTRIDGE</strong><span>Choose your legally obtained .gb or .gbc ROM</span></div></div><div class="bezel-label"><span>DOT MATRIX SCREEN</span><span>● ● ●</span></div></section>
<section class="toolbar"><label class="load">Load ROM<input id="rom" type="file" accept=".gb,.gbc,.zip,application/octet-stream"></label><span id="status" role="status">Waiting for ROM</span><button id="reset" type="button" title="Reload the current game">Reset</button></section>
<div class="controls"><div class="dpad" aria-label="Directional pad"><button data-button="up" class="up" aria-label="Up">▲</button><button data-button="left" class="left" aria-label="Left">◀</button><span></span><button data-button="right" class="right" aria-label="Right">▶</button><button data-button="down" class="down" aria-label="Down">▼</button></div><div class="system-buttons"><button data-button="select">SELECT</button><button data-button="start">START</button></div><div class="actions"><button data-button="b" class="b" aria-label="B">B</button><button data-button="a" class="a" aria-label="A">A</button></div></div>
<footer>Drop a ROM anywhere on the console. Game Boy resolution: 160 × 144. Emulator and saves run in your browser.</footer></main><script type="module" src="js/player.js"></script></body></html>
